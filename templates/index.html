<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Emotion Detector</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        :root {
            --primary-color: #8e44ad; --primary-hover: #732d91; --light-bg: #f0f2f5;
            --dark-text: #34495e; --light-text: #ffffff; --border-color: #dfe6e9;
            --card-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); 
            
            /* Emotion Colors */
            --success-color: #2ecc71;  /* calm */
            --error-color: #e74c3c;    /* angry */
            --info-color: #3498db;     /* sad */
            --warning-color: #f39c12;  /* happy */
            --disabled-color: #bdc3c7; /* neutral */
            --fear-color: #9b59b6;     /* fear */
            --disgust-color: #16a085;  /* disgust */
            --surprise-color: #e67e22; /* surprise */
        }
        
        /* --- NEW: Animation --- */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        body {
            font-family: 'Poppins', sans-serif; background: var(--light-bg); display: flex;
            flex-direction: column; /* Stack header and content */
            align-items: center; min-height: 100vh; margin: 0; padding: 0; box-sizing: border-box;
        }
        header {
            background-color: var(--primary-color);
            color: var(--light-text);
            padding: 15px 0;
            text-align: center;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky; /* Make header sticky */
            top: 0;
            z-index: 10; /* Ensure header stays on top */
        }
        header h1 {
            color: var(--light-text); margin: 0; font-size: 1.5rem;
        }
        nav {
            margin-top: 10px;
        }
        nav button {
            background: none; border: none; color: var(--light-text); opacity: 0.7;
            padding: 8px 15px; margin: 0 5px; font-size: 1rem; font-family: 'Poppins', sans-serif;
            cursor: pointer; border-radius: 5px; transition: background-color 0.3s, opacity 0.3s;
        }
        nav button.active {
            background-color: rgba(255, 255, 255, 0.2);
            opacity: 1;
            font-weight: 600;
        }
        nav button:hover:not(.active) {
            background-color: rgba(255, 255, 255, 0.1);
            opacity: 0.9;
        }
        main {
            width: 100%;
            max-width: 500px; /* Max width for content */
            padding: 20px;
            box-sizing: border-box;
            margin-top: 20px; /* Space below header */
        }
        .card {
            background: var(--light-text); border-radius: 15px; box-shadow: var(--card-shadow);
            padding: 25px 30px; text-align: center; width: 100%;
            box-sizing: border-box;
            display: none; /* Hide inactive sections by default */
        }
        .card.active {
            display: block; /* Show active section */
        }
        h2 { color: var(--primary-color); margin-top: 0; margin-bottom: 15px; font-weight: 600; font-size: 1.4rem; border-bottom: 2px solid var(--border-color); padding-bottom: 5px;}

        /* --- NEW: Emotion Circle Display --- */
        .emotion-display-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            min-height: 130px; /* Reserve space */
        }
        .emotion-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #fafafa; /* Slightly off-white */
            border: 6px solid var(--border-color); /* Default border */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: border-color 0.3s ease-in-out;
        }
        .emotion-circle.pop {
            animation: pop 0.3s ease-in-out;
        }
        .emotion-circle span { /* The emoji icon itself */
            font-size: 4rem; /* 64px */
            line-height: 1;
            transition: transform 0.2s;
        }
        /* --- END NEW --- */


        /* Real-Time Section Specific Styles */
        #realtime-result-text { 
            font-size: 1.4rem; font-weight: 600; color: var(--primary-color); margin-top: 0; min-height: 1.5em; 
        }
        .controls { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }

        /* File Upload Section Specific Styles */
        #file-upload-section input[type="file"] {
            display: block; margin: 15px auto; border: 1px solid var(--border-color); padding: 10px; border-radius: 5px; cursor: pointer; max-width: 90%;
        }
        #file-upload-section .btn-analyze { background-color: var(--info-color); color: var(--light-text); }
        #file-upload-section .btn-analyze:hover { background-color: #2980b9; }
        #file-result-text { 
            font-size: 1.4rem; font-weight: 600; color: var(--info-color); margin-top: 0; min-height: 1.5em; 
        }

        /* General Button Styles */
        .btn {
            padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.9rem;
            font-weight: 600; cursor: pointer; transition: background-color 0.3s, transform 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-start { background-color: var(--success-color); color: var(--light-text); }
        .btn-start:hover { background-color: #27ae60; }
        .btn-stop { background-color: var(--error-color); color: var(--light-text); }
        .btn-stop:hover { background-color: #c0392b; }
        .btn:disabled { background-color: var(--disabled-color); cursor: not-allowed; }

        /* Status Message Styles */
        #status-message-realtime, #status-message-upload { margin-top: 15px; font-weight: 400; min-height: 1.2em; font-size: 0.9rem;}
        .status-info { color: var(--info-color); }
        .status-success { color: var(--success-color); }
        .status-error { color: var(--error-color); }
        .status-warning { color: var(--warning-color); }

        /* Basic Mobile Responsiveness */
        @media (max-width: 600px) {
            header h1 { font-size: 1.3rem; }
            nav button { font-size: 0.9rem; padding: 6px 10px;}
            .card { padding: 20px; }
            h2 { font-size: 1.2rem; }

            /* --- NEW EMOJI MOBILE STYLE --- */
            .emotion-display-container {
                min-height: 110px;
            }
            .emotion-circle {
                width: 100px;
                height: 100px;
                border-width: 5px;
            }
            .emotion-circle span {
                font-size: 3.5rem;
            }
            
            #realtime-result-text, #file-result-text { 
                font-size: 1.2rem; /* Adjusted text size */
            }
            .btn { font-size: 0.85rem; padding: 10px 15px;}
        }
    </style>
</head>
<body>

    <header>
        <h1>Speech Emotion Detector</h1>
        <nav>
            <button id="nav-realtime" data-target="realtime-section" class="active">Real-Time</button>
            <button id="nav-upload" data-target="file-upload-section">Upload File</button>
        </nav>
    </header>

    <main>
        <div class="card active" id="realtime-section">
            <h2>Real-Time Detection</h2>
            
            <div class="emotion-display-container">
                <div id="realtime-emotion-circle" class="emotion-circle">
                    <span id="realtime-emoji-icon"></span>
                </div>
            </div>
            
            <p id="realtime-result-text">Press Start to Begin</p>
            <div class="controls">
                <button id="start-btn" class="btn btn-start">Start Detection</button>
                <button id="stop-btn" class="btn btn-stop" disabled>Stop Detection</button>
            </div>
            <p id="status-message-realtime" class="status-info">Waiting for microphone access...</p>
        </div>

        <div class="card" id="file-upload-section">
            <h2>Upload & Analyze File</h2>

            <div class="emotion-display-container">
                <div id="file-emotion-circle" class="emotion-circle">
                    <span id="file-emoji-icon"></span>
                </div>
            </div>

            <input type="file" id="audio-file-input" accept="audio/*">
            <button id="analyze-btn" class="btn btn-analyze">Analyze File</button>
            <p id="file-result-text">Upload an audio file</p>
            <p id="status-message-upload" class="status-info"></p>
        </div>
    </main>

    <script>
        // --- DOM Elements ---
        const navRealtimeButton = document.getElementById('nav-realtime');
        const navUploadButton = document.getElementById('nav-upload');
        const realtimeSection = document.getElementById('realtime-section');
        const fileUploadSection = document.getElementById('file-upload-section');

        const startButton = document.getElementById('start-btn');
        const stopButton = document.getElementById('stop-btn');
        const statusMessageRealtime = document.getElementById('status-message-realtime');
        const realtimeResultText = document.getElementById('realtime-result-text');
        // --- UPDATED DOM Elements ---
        const realtimeEmotionCircle = document.getElementById('realtime-emotion-circle');
        const realtimeEmojiIcon = document.getElementById('realtime-emoji-icon');

        const fileInput = document.getElementById('audio-file-input');
        const analyzeButton = document.getElementById('analyze-btn');
        const fileResultText = document.getElementById('file-result-text');
        const statusMessageUpload = document.getElementById('status-message-upload');
        // --- UPDATED DOM Elements ---
        const fileEmotionCircle = document.getElementById('file-emotion-circle');
        const fileEmojiIcon = document.getElementById('file-emoji-icon');


        // --- Real-Time Variables ---
        let socket;
        let mediaStream;
        let audioContext;
        let scriptProcessor;
        let isDetecting = false;

        const SAMPLE_RATE = 16000; // Must match the backend
        const BUFFER_SIZE = 4096; // Processing buffer size for Web Audio API
        
        // --- NEW: EMOJI and COLOR MAPPING ---
        // Make sure keys are lowercase
        const emotionData = {
            'happy':    { emoji: '😊', color: 'var(--warning-color)' },
            'sad':      { emoji: '😢', color: 'var(--info-color)' },
            'angry':    { emoji: '😠', color: 'var(--error-color)' },
            'neutral':  { emoji: '😐', color: 'var(--disabled-color)' },
            'fear':     { emoji: '😨', color: 'var(--fear-color)' },
            'fearful':  { emoji: '😨', color: 'var(--fear-color)' }, // Alias for 'fear'
            'disgust':  { emoji: '🤢', color: 'var(--disgust-color)' },
            'surprise': { emoji: '😮', color: 'var(--surprise-color)' },
            'surprised':{ emoji: '😮', color: 'var(--surprise-color)' }, // Alias
            'calm':     { emoji: '😌', color: 'var(--success-color)' },
            // --- Add more as needed ---
            'anxious':  { emoji: '😟', color: 'var(--info-color)' },
            'bored':    { emoji: '😑', color: 'var(--disabled-color)' },
            'default':  { emoji: '❓', color: 'var(--dark-text)' } // Fallback
        };

        // --- Navigation Logic ---
        function showSection(targetId) {
            if (isDetecting && targetId !== 'realtime-section') {
                stopDetection();
            }
            realtimeSection.classList.remove('active');
            fileUploadSection.classList.remove('active');
            navRealtimeButton.classList.remove('active');
            navUploadButton.classList.remove('active');

            const targetSection = document.getElementById(targetId);
            const targetButton = document.getElementById(`nav-${targetId.split('-')[0]}`);
            if (targetSection) targetSection.classList.add('active');
            if (targetButton) targetButton.classList.add('active');
        }

        navRealtimeButton.addEventListener('click', () => showSection('realtime-section'));
        navUploadButton.addEventListener('click', () => showSection('file-upload-section'));


        // --- Event Listeners (Detection & Upload) ---
        startButton.addEventListener('click', startDetection);
        stopButton.addEventListener('click', stopDetection);
        analyzeButton.addEventListener('click', analyzeFile);
        
        // --- NEW: Clear file result when new file is selected ---
        fileInput.addEventListener('change', () => {
             fileResultText.textContent = 'Upload an audio file';
             fileEmojiIcon.textContent = '';
             fileEmotionCircle.style.borderColor = 'var(--border-color)'; // Reset border
             displayUploadStatus(''); // Clear status
        });

        // --- Real-Time Functions ---
        function startDetection() {
            if (isDetecting) return;
            if (!realtimeSection.classList.contains('active')) {
                showSection('realtime-section');
            }
            setRealtimeLoadingState(true, 'Connecting...');
            fileInput.disabled = true; 
            analyzeButton.disabled = true;

            socket = io(window.location.origin);

            socket.on('connect', () => {
                console.log('Connected to server via WebSocket.');
                displayRealtimeStatus('Connection successful! Starting microphone...', 'success');
                initMicrophone();
            });
            socket.on('connect_error', (err) => {
                console.error('WebSocket Connection failed:', err);
                displayRealtimeStatus('Could not connect to the server.', 'error');
                stopDetection();
            });
            socket.on('disconnect', () => {
                console.log('Disconnected from server.');
                 if (isDetecting) {
                     displayRealtimeStatus('Server disconnected.', 'error');
                     stopDetection();
                 }
            });
            socket.on('emotion_result', (data) => {
                updateRealtimeEmotion(data.emotion);
            });
             socket.on('error', (data) => {
                console.error('Server error:', data.message);
                displayRealtimeStatus(`Server Error: ${data.message}`, 'error');
            });
        }

        function stopDetection() {
            if (!isDetecting && !mediaStream && !audioContext && !socket) return;
            
            console.log("Stopping detection...");
            setRealtimeLoadingState(false, 'Detection stopped.');
            fileInput.disabled = false;
            analyzeButton.disabled = false;

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
             if (scriptProcessor) {
                scriptProcessor.disconnect();
                scriptProcessor.onaudioprocess = null; 
                scriptProcessor = null;
             }
             if (audioContext) {
                setTimeout(() => {
                    if (audioContext && audioContext.state !== 'closed') {
                        audioContext.close().catch(e => console.error("Error closing AudioContext:", e));
                        audioContext = null;
                    }
                }, 100); 
             }
            if (socket) {
                socket.disconnect();
                socket = null;
            }
            
            // --- UPDATED: Reset UI on stop ---
            updateRealtimeEmotion(null, true); // true = isReset
        }

        async function initMicrophone() {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('getUserMedia not supported on your browser!');
                }
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!audioContext || audioContext.state === 'closed') {
                    audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });
                } else if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                const source = audioContext.createMediaStreamSource(mediaStream);
                scriptProcessor = audioContext.createScriptProcessor(BUFFER_SIZE, 1, 1);

                scriptProcessor.onaudioprocess = (event) => {
                    const inputData = event.inputBuffer.getChannelData(0);
                    if (socket && socket.connected) {
                        const int16Data = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            int16Data[i] = Math.max(-1, Math.min(1, inputData[i])) * 32767;
                        }
                        socket.emit('audio_stream', int16Data.buffer);
                    }
                };

                source.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination); 

                displayRealtimeStatus('Microphone active. Listening...', 'success');
                isDetecting = true; 

            } catch (err) {
                console.error('Error initializing microphone:', err);
                let userMessage = 'Could not access microphone.';
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    userMessage = 'Microphone permission denied. Please grant permission.';
                } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                     userMessage = 'No microphone found.';
                } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                    userMessage = 'Microphone is already in use or cannot be accessed.';
                }
                displayRealtimeStatus(userMessage, 'error');
                stopDetection(); // Ensure cleanup on failure
            }
        }

        // --- UPDATED Function ---
        function updateRealtimeEmotion(emotion, isReset = false) {
            if (isReset) {
                realtimeResultText.textContent = 'Press Start to Begin';
                realtimeEmojiIcon.textContent = ''; // Clear emoji
                realtimeEmotionCircle.style.borderColor = 'var(--border-color)'; // Reset border
                realtimeEmotionCircle.classList.remove('pop');
                return;
            }
            if (!emotion) return; 

            const emotionKey = emotion.toLowerCase();
            const data = emotionData[emotionKey] || emotionData['default'];
            const emotionName = emotion.charAt(0).toUpperCase() + emotion.slice(1);
            
            realtimeResultText.textContent = `Detected: ${emotionName}`;
            realtimeEmojiIcon.textContent = data.emoji;
            realtimeEmotionCircle.style.borderColor = data.color; // Set border color

            // Trigger "pop" animation
            realtimeEmotionCircle.classList.remove('pop'); // Remove first to re-trigger
            void realtimeEmotionCircle.offsetWidth; // Trigger reflow
            realtimeEmotionCircle.classList.add('pop');
        }

        function displayRealtimeStatus(message, type = 'info') {
            statusMessageRealtime.textContent = message;
            statusMessageRealtime.className = `status-${type}`;
        }

        function setRealtimeLoadingState(isLoading, message = '') {
            isDetecting = isLoading; 
            startButton.disabled = isLoading;
            stopButton.disabled = !isLoading;
            displayRealtimeStatus(message, 'info');
        }


        // --- File Upload Functions ---
        async function analyzeFile() {
            if (!fileUploadSection.classList.contains('active')) {
                showSection('file-upload-section');
            }

            const file = fileInput.files[0];
            if (!file) {
                displayUploadStatus('Please select an audio file first.', 'warning');
                return;
            }

            setUploadLoadingState(true, 'Uploading and analyzing...');
            startButton.disabled = true; // Disable real-time start during upload
            
            // --- UPDATED: Reset UI for file upload ---
            fileResultText.textContent = 'Analyzing...';
            fileEmojiIcon.textContent = '⏳';
            fileEmotionCircle.style.borderColor = 'var(--info-color)'; // Loading border

            const formData = new FormData();
            formData.append('audio_file', file);

            try {
                const response = await fetch(`${window.location.origin}/upload_predict`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `HTTP error! status: ${response.status}`);
                }

                // --- UPDATED: Show emoji and border on success ---
                if (data.emotion) {
                    const emotionName = data.emotion.charAt(0).toUpperCase() + data.emotion.slice(1);
                    const emotionKey = data.emotion.toLowerCase();
                    const emotionInfo = emotionData[emotionKey] || emotionData['default'];

                    fileResultText.textContent = `File Result: ${emotionName}`;
                    fileEmojiIcon.textContent = emotionInfo.emoji; // Set emoji
                    fileEmotionCircle.style.borderColor = emotionInfo.color; // Set border

                    // Trigger "pop" animation
                    fileEmotionCircle.classList.remove('pop');
                    void fileEmotionCircle.offsetWidth;
                    fileEmotionCircle.classList.add('pop');

                    displayUploadStatus('Analysis complete.', 'success');
                } else {
                    throw new Error(data.error || 'Received unexpected response from server.');
                }

            } catch (error) {
                console.error('Error analyzing file:', error);
                // --- UPDATED: Show error emoji and border ---
                fileResultText.textContent = 'Analysis Failed';
                fileEmojiIcon.textContent = '❌'; // Set error emoji
                fileEmotionCircle.style.borderColor = 'var(--error-color)'; // Set error border
                displayUploadStatus(`Error: ${error.message}`, 'error');
            } finally {
                setUploadLoadingState(false);
                if (!isDetecting) {
                   startButton.disabled = false;
                }
                 // Don't clear fileInput.value here, let the 'change' event handle resets
            }
        }

        function displayUploadStatus(message, type = 'info') {
            statusMessageUpload.textContent = message;
            statusMessageUpload.className = `status-${type}`;
        }

        function setUploadLoadingState(isLoading, message = '') {
            analyzeButton.disabled = isLoading;
            if (isLoading) {
                displayUploadStatus(message, 'info');
            } else if (!statusMessageUpload.classList.contains('status-error') && !statusMessageUpload.classList.contains('status-warning')) {
                 displayUploadStatus('');
            }
        }

        // --- Initial state ---
        function initApp() {
            showSection('realtime-section');
            displayRealtimeStatus('Press Start to Begin', 'info');
            displayUploadStatus(''); 
            realtimeEmojiIcon.textContent = '';
            fileEmojiIcon.textContent = '';
            realtimeEmotionCircle.style.borderColor = 'var(--border-color)';
            fileEmotionCircle.style.borderColor = 'var(--border-color)';
        }

        initApp(); // Run on load

    </script>
</body>
</html>
