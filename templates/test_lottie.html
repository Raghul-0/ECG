<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lottie Animation Test</title>
    <!-- 1. Get the Lottie Player library from the web -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            flex-direction: column;
            font-family: sans-serif;
        }
        h1 {
            color: #333;
        }
        lottie-player {
            width: 300px;
            height: 300px;
            border: 2px solid #ccc;
            background-color: white;
        }
    </style>
</head>
<body>
    <h1>Testing "happy.json"</h1>
    
    <!-- 2. Display the animation -->
    <!-- The `src` path points to the file you want to test. -->
    <!-- You can change 'happy.json' to 'sad.json', 'angry.json', etc. to test others. -->
    <lottie-player
        src="static/animations/happy.json"
        background="transparent"
        speed="1"
        autoplay
        loop>
    </lottie-player>
    
</body>
</html>
